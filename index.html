class DigitalTwinOffice{constructor(container){this.container=container;this.scene=new THREE.Scene();this.camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,60);this.renderer=null;this.raycaster=new THREE.Raycaster();this.pointer=new THREE.Vector2();this.hitboxes=[];this.cameraState='IDLE';this.activeView='overview';this.isNight=false;this.dragging=false;this.pointerDown=null;this.lastPointer=null;this.orbitTarget=new THREE.Vector3(...VIEWS.overview.target);this.yaw=.68;this.pitch=.46;this.radius=11.1;this.lastFrame=performance.now();this.frameCount=0;this.fps=60;this.init()}
init(){try{this.renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});this.renderer.outputColorSpace=THREE.SRGBColorSpace;this.renderer.toneMapping=THREE.ACESFilmicToneMapping;this.renderer.toneMappingExposure=1.08;this.renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));this.renderer.setSize(innerWidth,innerHeight);this.container.prepend(this.renderer.domElement);this.buildScene();this.bindEvents();this.setViewInstant('overview');this.animate()}catch(err){document.getElementById('error-panel').hidden=false;document.getElementById('error-message').textContent=String(err)}}
box(name,size,pos,color,parent=this.scene){const mesh=new THREE.Mesh(new THREE.BoxGeometry(...size),new THREE.MeshStandardMaterial({color,roughness:.8,metalness:.03}));mesh.name=name;mesh.position.set(...pos);parent.add(mesh);return mesh} cyl(name,r,h,pos,color,parent=this.scene){const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20),new THREE.MeshStandardMaterial({color,roughness:.76}));mesh.name=name;mesh.position.set(...pos);parent.add(mesh);return mesh}
buildScene(){this.scene.background=new THREE.Color('#d8d0c6');this.scene.fog=new THREE.Fog('#d8d0c6',13,27);this.hemi=new THREE.HemisphereLight(0xfff8ee,0x5c6874,2.2);this.key=new THREE.DirectionalLight(0xffe6c1,2.8);this.key.position.set(5,9,4);this.scene.add(this.hemi,this.key);this.box('ENV_Floor',[10,.18,7],[0,-.09,0],'#d8d0c4');this.box('ENV_BackWall',[10,4.4,.16],[0,2.1,-3.45],'#e9e4dc');this.box('ENV_LeftWall',[.16,4.4,7],[-4.92,2.1,0],'#e9e4dc');this.box('ENV_Window',[.06,2.3,2.4],[-4.78,2.45,.2],'#9eb4bd');const desk=new THREE.Group();this.scene.add(desk);this.box('DeskTop',[3.5,.18,1.45],[0,1.02,.55],'#754827',desk);this.box('DeskLegL',[.22,.95,1.1],[-1.38,.52,.55],'#171a1d',desk);this.box('DeskLegR',[.22,.95,1.1],[1.38,.52,.55],'#171a1d',desk);this.box('DeskScreen',[1.45,.85,.09],[0,1.75,.28],'#002030',desk);this.box('DeskStand',[.12,.55,.12],[0,1.37,.36],'#8d969e',desk);const chair=new THREE.Group();this.scene.add(chair);this.cyl('ChairBase',.52,.08,[0,.16,2.0],'#151719',chair);this.cyl('ChairStem',.08,.72,[0,.54,2.0],'#8f959b',chair);this.box('ChairSeat',[1.05,.16,1],[0,.88,2.0],'#141619',chair);this.box('ChairBack',[1.05,1.25,.16],[0,1.55,2.38],'#111315',chair);this.box('ProjectWall',[3.65,2,.12],[3.48,1.65,-3.28],'#1d2227');for(let i=0;i<3;i++)this.box('ProjectPanel'+i,[1.02,1.35,.05],[2.28+i*1.2,1.65,-3.19],i===1?'#002337':'#70777c');const cab=new THREE.Group();this.scene.add(cab);this.box('Cabinet',[1.6,2.1,.65],[-3.55,1.05,-2.7],'#8b6a4d',cab);for(let y=.45;y<1.9;y+=.48)this.box('Shelf',[1.45,.05,.68],[-3.55,y,-2.68],'#1c2024',cab);const ai=new THREE.Group();this.scene.add(ai);this.box('AITable',[2.2,.14,1],[3.08,.76,.62],'#4b5156',ai);this.box('AIScreen',[1.4,.82,.07],[3.08,1.47,.32],'#00273a',ai);this.cyl('AIOrb',.33,.66,[2.25,1.16,.9],'#e0a72e',ai).rotation.z=Math.PI/2;const know=new THREE.Group();this.scene.add(know);this.box('Bookshelf',[1.8,2.45,.55],[-3.55,1.22,-1.2],'#855f40',know);for(let y=.35;y<2.2;y+=.5)this.box('KShelf',[1.65,.05,.58], pick(e){if(this.cameraState!=='IDLE')return;const rect=this.renderer.domElement.getBoundingClientRect();this.pointer.x=((e.clientX-rect.left)/rect.width)*2-1;this.pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;this.raycaster.setFromCamera(this.pointer,this.camera);const hit=this.raycaster.intersectObjects(this.hitboxes,false)[0];if(hit)this.transitionTo(hit.object.userData.view)}
setViewInstant(name){const v=VIEWS[name];this.camera.position.set(...v.position);this.orbitTarget.set(...v.target);this.activeView=name;this.recalculateOrbitFromCamera();this.syncUI(name)}
transitionTo(name){const view=VIEWS[name];if(!view)return;if(this.cameraState==='TRANSITIONING')return;this.cameraState='TRANSITIONING';this.setStatus();gsap.killTweensOf(this.camera.position);gsap.killTweensOf(this.orbitTarget);if(name==='overview')this.closeDrawer();const target=new THREE.Vector3(...view.target);const tl=gsap.timeline({defaults:{duration:1.15,ease:'power2.inOut'},onComplete:()=>{this.activeView=name;this.cameraState='IDLE';if(name==='overview'){this.recalculateOrbitFromCamera()}else if(view.panel){this.openDrawer(view.panel)}this.syncUI(name);this.setStatus()}});tl.to(this.camera.position,{x:view.position[0],y:view.position[1],z:view.position[2]},0).to(this.orbitTarget,{x:target.x,y:target.y,z:target.z},0)}
recalculateOrbitFromCamera(){this.orbitTarget.set(...VIEWS.overview.target);const v=this.camera.position.clone().sub(this.orbitTarget);this.radius=v.length();this.pitch=Math.asin(v.y/this.radius);this.yaw=Math.atan2(v.x,v.z)}
renderDashboard(key){const host=document.getElementById('dashboard');const d=DASHBOARDS[key];if(!d){host.className='dashboard';host.innerHTML='';return}const w=300,h=100,pad=10;const pts=(arr)=>arr.map((v,i)=>{const x=pad+i*((w-pad*2)/(arr.length-1));const y=h-pad-(v/100)*(h-pad*2);return `${x.toFixed(1)},${y.toFixed(1)}`}).join(' ');const areaPts=`${pad},${h-pad} ${pts(d.actual)} ${w-pad},${h-pad}`;host.className='dashboard show';host.innerHTML=`<div class="dash-section"><h3>EXECUTIVE DASHBOARD <span class="demo-tag">DEMO DATA</span></h3><div class="dash-kpis">${d.kpis.map(([v,l,t])=>`<div class="kpi"><small>${l}</small><b>${v}</b><em>${t}</em></div>`).join('')}</div></div><div class="dash-section"><h3>進度 S-Curve</h3><svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line class="axis" x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}"></line><line class="axis" x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}"></line><polygon class="area" points="${areaPts}"></polygon><polyline class="plan" points="${pts(d.plan)}"></polyline><polyline class="actual" points="${pts(d.actual)}"></polyline></svg><div class="legend"><span><i class="dot planDot"></i>計畫</span><span><i class="dot actualDot"></i>實際</span></div></div><div class="dash-section"><h3>工作面完成率</h3>${d.bars.map(([n,v])=>`<div class="barrow"><span>${n}</span><div class="track"><div class="fill" style="width:${v}%"></div></div><b>${v}%</b></div>`).join('')}</div><div class="dash-section"><h3>風險分布</h3><div class="risk-grid">${d.risks.map(([v,l])=>`<div class="risk"><b>${v}</b><span>${l}</span></div>`).join('')}</div></div><div class="dash-section"><h3>近期主管決策事項</h3><div class="decision-list">${d.decisions.map(x=>`<div class="decision">${x}</div>`).join('')}</div></div>`}
openDrawer(key){const data=CONTENT[key];if(!data)return;document.getElementById('drawer-kicker').textContent=data.kicker;document.getElementById('drawer-title').textContent=data.title;document.getElementById('drawer-summary').textContent=data.summary;document.getElementById('drawer-metrics').innerHTML=data.metrics.map(([a,b])=>`<div class="metric"><b>${a}</b><span>${b}</span></div>`).join('');this.renderDashboard(key);const drawer=document.getElementById('drawer');drawer.classList.add('open');drawer.setAttribute('aria-hidden','false')}
closeDrawer(){const drawer=document.getElementById('drawer');drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true')}
toggleTheme(){this.isNight=!this.isNight;const targetBg=new THREE.Color(this.isNight?'#11161d':'#d8d0c6');const targetFog=new THREE.Color(this.isNight?'#11161d':'#d8d0c6');gsap.to(this.scene.background,{r:targetBg.r,g:targetBg.g,b:targetBg.b,duration:.8});gsap.to(this.scene.fog.color,{r:targetFog.r,g:targetFog.g,b:targetFog.b,duration:.8});gsap.to(this.hemi,{intensity:this.isNight?.75:2.2,duration:.8});gsap.to(this.key,{intensity:this.isNight?.35:2.8,duration:.8});document.getElementById('theme-toggle').textContent=this.isNight?'☀ 日間':'☾ 夜間'}
syncUI(name){document.getElementById('active-view').textContent=name.toUpperCase();document.querySelectorAll('[data-view]').forEach(btn=>btn.classList.toggle('active',btn.dataset.view===name));if(name!=='overview')document.getElementById('hint').textContent='按右側 × 或點「全景」返回';else document.getElementById('hint').textContent='單指拖曳旋轉 · 點擊發光區域 · 下方按鈕快速切換'}
setStatus(){document.getElementById('camera-state').textContent=this.cameraState;document.getElementById('active-view').textContent=this.activeView.toUpperCase()}
updateCamera(){if(this.activeView!=='overview'||this.cameraState!=='IDLE')return;const cp=Math.cos(this.pitch);this.camera.position.set(this.orbitTarget.x+Math.sin(this.yaw)*cp*this.radius,this.orbitTarget.y+Math.sin(this.pitch)*this.radius,this.orbitTarget.z+Math.cos(this.yaw)*cp*this.radius)}
updateMetrics(now){this.frameCount++;if(now-this.lastFrame>=700){this.fps=Math.round(this.frameCount*1000/(now-this.lastFrame));this.frameCount=0;this.lastFrame=now;document.getElementById('fps').textContent=this.fps;document.getElementById('draw-calls').textContent=this.renderer.info.render.calls;document.getElementById('triangles').textContent=this.renderer.info.render.triangles;document.getElementById('dpr').textContent=this.renderer.getPixelRatio().toFixed(1);if(this.fps<30&&this.renderer.getPixelRatio()>1)this.renderer.setPixelRatio(Math.max(1,this.renderer.getPixelRatio()-.1))}}
animate=(now=performance.now())=>{requestAnimationFrame(this.animate);if(this.paused)return;this.updateCamera();this.camera.lookAt(this.orbitTarget);this.renderer.render(this.scene,this.camera);this.updateMetrics(now)}}
new DigitalTwinOffice(document.getElementById('app'));
</script>
