<style>
:root{--gold:#d6a65d;--ink:#121212;--panel:rgba(18,18,18,.82);--muted:#b9b1a6;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171615;color:#fff;font-family:"Microsoft JhengHei",system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}

.panel{position:fixed;z-index:40;right:18px;top:72px;width:min(380px,calc(100vw - 36px));max-height:calc(100vh - 165px);overflow:auto;padding:20px;border-radius:18px;background:linear-gradient(180deg,rgba(24,23,22,.95),rgba(13,13,13,.9));border:1px solid var(--line);box-shadow:0 22px 70px #0007;backdrop-filter:blur(18px);transform:translateX(calc(100% + 30px));transition:.32s cubic-bezier(.2,.8,.2,1)}.panel.open{transform:none}.panel .close{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:1px solid #ffffff16;background:#ffffff08;color:#fff;font-size:20px}.kicker{color:var(--gold);font-size:10px;letter-spacing:.16em;font-weight:800}.panel h2{margin:8px 42px 8px 0;font-size:22px}.panel p{margin:0;color:#c8c0b6;line-height:1.72;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.card{padding:11px;border-radius:12px;background:#ffffff07;border:1px solid #ffffff10}.card b{display:block;color:#e7c98f;font-size:13px}.card small{display:block;margin-top:4px;color:#9f988f;line-height:1.45}.privacy{margin-top:14px;color:#7f7972;font-size:10px;line-height:1.5}
@media(max-width:760px){.brand{left:10px;top:10px;padding:11px 12px}.brand b{font-size:12px}.brand span{display:none}.badge{right:10px;top:10px;font-size:11px}.nav{left:10px;right:10px;bottom:10px;transform:none;max-width:none}.nav button{padding:8px 10px;font-size:12px}.hint{bottom:66px;font-size:10px;max-width:88vw;overflow:hidden;text-overflow:ellipsis}.panel{right:10px;left:10px;top:58px;width:auto;max-height:calc(100vh - 135px)}.grid{grid-template-columns:1fr}}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"}}</script>

<body>
<div class="brand"><b>MICHAEL HUANG · EXECUTIVE STUDIO</b><span>工程管理 × 採購發包 × 成本治理 × AI 數位轉型</span></div>

<aside id="panel" class="panel"><button id="close" class="close">×</button><div id="kicker" class="kicker"></div><h2 id="title"></h2><p id="body"></p><div id="grid" class="grid"></div><div class="privacy">公開版不顯示手機、住址與推薦人聯絡資訊。</div></aside>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
const gsap=window.gsap;
const DATA={
 desk:{k:'EXECUTIVE PROFILE',t:'黃連燈 Michael Huang',b:'20+ 年營造工程實務，橫跨現場施工、工地主任、採購發包、成本控管、合約履約與 AI 數位應用。定位不是單一工項管理，而是把工程風險、成本、界面與制度整合成可執行的管理系統。',c:[['20+ 年','營造與採購實務'],['12+ 年','第一線施工管理'],['管理職','採購／採發／業務處'],['核心定位','工程治理 × AI']]},
 career:{k:'CAREER JOURNEY',t:'從工程官到工程管理主管',b:'職涯由現場工程出發，逐步歷經工程官、現場工程師、工程組長、工地主任、採發部經理、採購經理與業務處經理兼部門主管。',c:[['1985–2000','軍職工程官'],['2001–2008','工程師→組長→工地主任'],['2008–2016','理成營造｜採發部經理'],['2018–2026','安倉營造｜業務處經理']]},
 projects:{k:'PROJECTS & METHODS',t:'代表工程 × 管理方法',b:'參與大型公共工程、商業建築、住宅與特殊建築；管理重點包含圖說與數量檢核、施工界面、採購發包策略、契約風險、估驗結算與管理閉環。',c:[['台北表演藝術中心','後續裝修／採購發包／成本控管'],['華航園區／東吳大學','現場施工管理'],['新光三越／富邦 A10','大型商業建築經驗'],['管理閉環','偏差→原因→責任→改善→驗證']]},
 gallery:{k:'PORTFOLIO GALLERY',t:'工程作品與管理成果',b:'作品牆用來呈現工程案例、管理儀表板、SOP、教育訓練、出版成果與 AI 系統。此版先建立空間與互動層級，後續逐張接入真實照片與成果證據。',c:[['工程案例','現場／公共工程／施工成果'],['管理工具','Dashboard／SOP／表單'],['教材出版','課程／書籍／Skill'],['AI成果','Agent／KMS／PM 系統']]},
 ai:{k:'AI LAB',t:'AI Agent × KMS × 工程資料治理',b:'將 ChatGPT、Gemini、NotebookLM、Excel/VBA、Power Query 等導入採購、合約、工程知識管理與教育訓練，目標是把個人經驗轉成可重複使用、可查證、可追溯的工作流程。',c:[['AI Agent','廠商／報價／合約／風險'],['KMS','SOP／Lesson Learned／規範'],['Excel/VBA','成本與採購工具'],['GenAI','ChatGPT／Gemini／NotebookLM']]},
 education:{k:'EDUCATION & CERTIFICATIONS',t:'學歷與工程專業資格',b:'國立台北科技大學技術及職業教育研究所碩士；國防大學中正理工學院土木工程科。具工地主任、公共工程品質管理、公共工程機電品管與工安相關訓練資格。',c:[['北科大','技職教育研究所碩士'],['中正理工','土木工程科'],['工地主任','工程現場管理'],['品管／安衛','公共工程相關資格']]}
};
const scene=new THREE.Scene();scene.background=new THREE.Color('#cfc7ba');scene.fog=new THREE.Fog('#cfc7ba',20,36);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,80);camera.position.set(9,5.1,11.8);let target=new THREE.Vector3(0,1.65,-.7);camera.lookAt(target);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<760?1.2:1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xfff2da,0x3d332d,1.5);scene.add(hemi);const key=new THREE.DirectionalLight(0xffdfb0,2.7);key.position.set(4,8,7);key.castShadow=true;scene.add(key);const warm=new THREE.PointLight(0xffbb72,9,8,2);warm.position.set(-3.2,3.6,-1.1);scene.add(warm);
const mat=(c,r=.65,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const leather=new THREE.MeshPhysicalMaterial({color:'#711f25',roughness:.42,clearcoat:.32,clearcoatRoughness:.5});const walnut=new THREE.MeshPhysicalMaterial({color:'#5a321f',roughness:.48,clearcoat:.15});const brass=new THREE.MeshStandardMaterial({color:'#b98a48',roughness:.32,metalness:.72});const dark=new THREE.MeshStandardMaterial({color:'#181717',roughness:.58});
function rb(w,h,d,r=.07,material=dark){const o=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,5,r),material);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function cyl(rt,rbm,h,seg,material){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rbm,h,seg),material);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
// room
const floor=rb(12.6,.18,8.8,.03,mat('#8b6342',.72));floor.position.y=-.08;for(let z=-4;z<4.4;z+=.58){const seam=rb(12.4,.012,.018,.002,mat('#3d2418',.9));seam.position.set(0,.018,z)}
const back=rb(12.6,5.3,.15,.02,mat('#d8d0c5',.92));back.position.set(0,2.5,-4.28);const left=rb(.15,5.3,8.8,.02,mat('#e5ded3',.92));left.position.set(-6.2,2.5,0);const right=rb(.15,5.3,8.8,.02,mat('#d4cec6',.92));right.position.set(6.2,2.5,0);
// back walnut band and project board
const band=rb(12.2,1.0,.12,.03,walnut);band.position.set(0,.55,-4.16);const board=rb(8.65,3.0,.11,.08,mat('#101214',.45));board.position.set(.55,2.95,-4.09);board.name='projects';
// board gold rails
for(const y of [1.55,4.35]){const rail=rb(8.72,.035,.035,.01,brass);rail.position.set(.55,y,-3.99)}
// left career wall
const careerPanel=rb(4.45,3.15,.09,.05,mat('#efe9df',.9));careerPanel.position.set(-3.55,2.8,-3.98);careerPanel.name='career';
// right portfolio frames
const frames=[];for(let i=0;i<6;i++){const x=5.98,y=1.05+(i%3)*1.2,z=-2.55+Math.floor(i/3)*3.15;const f=rb(.08,.92,1.78,.025,walnut);f.position.set(x,y,z);f.rotation.y=Math.PI/2;frames.push(f)}const hitGallery=rb(.06,3.65,6.4,.02,new THREE.MeshBasicMaterial({transparent:true,opacity:0}));hitGallery.position.set(6.08,2.55,.3);hitGallery.name='gallery';
// low cabinets
for(const x of [-4.2,3.9]){const cab=rb(3.15,.72,.72,.07,walnut);cab.position.set(x,.44,-3.72);for(const dx of [-.72,.72]){const knob=cyl(.035,.035,.05,16,brass);knob.rotation.z=Math.PI/2;knob.position.set(x+dx,.46,-3.31)}}
// rug
const rug=new THREE.Mesh(new THREE.CylinderGeometry(3.25,3.25,.055,72),mat('#d8d0c3',.98));rug.position.set(0,.035,.7);rug.receiveShadow=true;scene.add(rug);
// executive desk top and monolithic legs
const deskTop=rb(4.9,.23,1.78,.09,walnut);deskTop.position.set(0,1.12,.72);deskTop.name='desk';const dl=rb(.55,1.02,1.55,.06,walnut);dl.position.set(-2.0,.58,.72);const dr=rb(.55,1.02,1.55,.06,walnut);dr.position.set(2.0,.58,.72);const brassLine=rb(4.4,.035,.035,.01,brass);brassLine.position.set(0,1.24,1.62);
// monitor
const monitor=rb(2.45,1.38,.11,.06,mat('#101113',.35));monitor.position.set(.18,2.02,.45);const screen=rb(2.26,1.18,.02,.04,new THREE.MeshStandardMaterial({color:'#0c1822',emissive:'#17384d',emissiveIntensity:.22,roughness:.35}));screen.position.set(.18,2.02,.38);screen.name='desk';const stem=cyl(.08,.11,.58,24,dark);stem.position.set(.18,1.38,.45);const base=rb(.78,.06,.48,.04,dark);base.position.set(.18,1.08,.48);
// chair, sculptural executive silhouette
const chairBack=rb(1.45,2.05,.34,.18,leather);chairBack.position.set(.1,1.92,2.55);chairBack.rotation.x=-.08;const chairSeat=rb(1.48,.34,1.25,.16,leather);chairSeat.position.set(.1,1.05,2.2);const lumbar=rb(1.2,.54,.18,.12,new THREE.MeshPhysicalMaterial({color:'#8a2b31',roughness:.45,clearcoat:.25}));lumbar.position.set(.1,1.72,2.32);for(const sx of [-1,1]){const armPost=cyl(.07,.08,.72,20,dark);armPost.position.set(.1+sx*.86,1.15,2.25);const arm=rb(.18,.15,.9,.07,leather);arm.position.set(.1+sx*.86,1.5,2.23)}const lift=cyl(.08,.1,.72,24,dark);lift.position.set(.1,.58,2.2);for(let i=0;i<5;i++){const a=i*Math.PI*2/5;const leg=rb(.75,.08,.1,.03,dark);leg.position.set(.1+Math.cos(a)*.34,.22,2.2+Math.sin(a)*.34);leg.rotation.y=-a;const wheel=cyl(.09,.09,.07,16,dark);wheel.rotation.z=Math.PI/2;wheel.position.set(.1+Math.cos(a)*.72,.15,2.2+Math.sin(a)*.72)}
// brass desk lamp
const lampBase=cyl(.24,.28,.07,36,brass);lampBase.position.set(-1.55,1.28,.55);const lampStem=cyl(.045,.045,1.2,16,brass);lampStem.position.set(-1.55,1.85,.55);lampStem.rotation.z=-.42;const shade=new THREE.Mesh(new THREE.ConeGeometry(.34,.42,32,1,true),brass);shade.position.set(-1.85,2.32,.55);shade.rotation.z=Math.PI/2-.35;scene.add(shade);
// desk props
const phone=rb(.52,.055,.9,.06,mat('#202124',.35));phone.position.set(1.55,1.3,.83);phone.rotation.y=-.16;phone.name='ai';const book1=rb(.72,.08,.48,.025,mat('#21354f',.65));book1.position.set(-.85,1.31,1.0);book1.rotation.y=.08;const book2=rb(.76,.08,.5,.025,mat('#6f2a2a',.65));book2.position.set(-.84,1.39,1.0);book2.name='education';const cup=cyl(.13,.16,.3,24,mat('#e4ddcf',.55));cup.position.set(.85,1.39,.85);
// plant
const pot=cyl(.42,.34,.66,28,mat('#40362e',.85));pot.position.set(4.9,.35,-2.65);for(let i=0;i<16;i++){const leaf=rb(.15,.9,.04,.06,mat(i%2?'#406a43':'#557a4e',.72));leaf.position.set(4.9+(Math.random()-.5)*.55,1.02+Math.random()*.7,-2.65+(Math.random()-.5)*.45);leaf.rotation.z=(Math.random()-.5)*1.3;leaf.rotation.y=Math.random()*Math.PI}
// wall text canvases
function makeTex(title,lines,bg='#111315',accent='#d7aa65'){const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,1024,512);x.fillStyle=accent;x.font='700 46px Arial';x.fillText(title,44,68);x.fillStyle='#c6c0b8';x.font='24px Arial';lines.forEach((s,i)=>x.fillText(s,44,130+i*48));const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const bt=makeTex('PROJECTS · METHODS · AI',['Engineering Governance','Procurement & Cost Control','Risk · Interface · Knowledge']);const bp=new THREE.Mesh(new THREE.PlaneGeometry(7.9,2.35),new THREE.MeshBasicMaterial({map:bt}));bp.position.set(.55,2.95,-4.02);scene.add(bp);
const ct=makeTex('CAREER JOURNEY',['1985  Engineering Officer','2001  Site Engineer → Superintendent','2008  Procurement / Commercial Management','2018  Business Dept. Manager'],'#efe9df','#31517c');const cp=new THREE.Mesh(new THREE.PlaneGeometry(3.95,2.62),new THREE.MeshBasicMaterial({map:ct}));cp.position.set(-3.55,2.8,-3.92);scene.add(cp);
// AI pedestal
const aiPed=rb(1.0,.82,.82,.12,mat('#171b20',.45));aiPed.position.set(4.55,.52,2.72);aiPed.name='ai';const orb=new THREE.Mesh(new THREE.SphereGeometry(.34,32,24),new THREE.MeshStandardMaterial({color:'#78b7cf',emissive:'#2d7d9c',emissiveIntensity:.65,roughness:.25}));orb.position.set(4.55,1.18,2.72);scene.add(orb);
const edHit=rb(2.0,.08,1.2,.02,new THREE.MeshBasicMaterial({transparent:true,opacity:0}));edHit.position.set(-4.8,.82,2.7);edHit.name='education';
const views={overview:{p:[9,5.1,11.8],t:[0,1.65,-.7]},desk:{p:[4.2,3.0,6.0],t:[0,1.55,.8]},career:{p:[-2.8,3.1,2.2],t:[-3.6,2.8,-3.8]},projects:{p:[2.8,3.7,2.0],t:[.6,2.95,-4.0]},gallery:{p:[3.7,3.2,5.8],t:[6.0,2.5,.3]},ai:{p:[5.8,2.4,5.3],t:[4.55,1.05,2.7]},education:{p:[-4.8,2.3,5.5],t:[-4.8,.9,2.7]}};
let anim=false;function focus(k){const v=views[k]||views.overview;gsap.killTweensOf(camera.position);gsap.killTweensOf(target);anim=true;gsap.to(camera.position,{x:v.p[0],y:v.p[1],z:v.p[2],duration:1.1,ease:'power3.inOut',onComplete:()=>anim=false});gsap.to(target,{x:v.t[0],y:v.t[1],z:v.t[2],duration:1.1,ease:'power3.inOut'});document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===k));if(DATA[k])openPanel(k)}
const panel=document.getElementById('panel');function openPanel(k){const d=DATA[k];if(!d)return;document.getElementById('kicker').textContent=d.k;document.getElementById('title').textContent=d.t;document.getElementById('body').textContent=d.b;document.getElementById('grid').innerHTML=d.c.map(x=>`<div class="card"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');panel.classList.add('open')}
document.getElementById('close').onclick=()=>panel.classList.remove('open');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>focus(b.dataset.v));
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('pointerup',e=>{if(Math.abs(e.movementX)>4||Math.abs(e.movementY)>4)return;mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(scene.children,true).find(h=>['desk','career','projects','gallery','ai','education'].includes(h.object.name));if(hit)focus(hit.object.name)});
let drag=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag||anim)return;const dx=(e.clientX-lastX)*.004,dy=(e.clientY-lastY)*.003;lastX=e.clientX;lastY=e.clientY;const off=camera.position.clone().sub(target);const sph=new THREE.Spherical().setFromVector3(off);sph.theta-=dx;sph.phi=Math.max(.65,Math.min(1.35,sph.phi+dy));camera.position.copy(target.clone().add(new THREE.Vector3().setFromSpherical(sph)))});
let night=false;document.getElementById('theme').onclick=()=>{night=!night;document.getElementById('theme').textContent=night?'☀ 日間':'☾ 夜間';gsap.to(renderer,{toneMappingExposure:night?.58:1.0,duration:.6});gsap.to(warm,{intensity:night?14:9,duration:.6});scene.background.set(night?'#101318':'#cfc7ba');scene.fog.color.set(night?'#101318':'#cfc7ba')};
function animate(){requestAnimationFrame(animate);camera.lookAt(target);orb.rotation.y+=.01;renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<760?1.2:1.5))});
document.addEventListener('visibilitychange',()=>{if(document.hidden){renderer.setAnimationLoop(null)}});
</script>
