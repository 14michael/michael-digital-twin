function dashTexture(kind){const d=DASH[kind],c=document.createElement('canvas');c.width=kind==='desk'?1280:1536;c.height=768;const x=c.getContext('2d'),W=c.width,H=c.height;let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#091018');g.addColorStop(1,'#18212a');x.fillStyle=g;x.fillRect(0,0,W,H);x.strokeStyle='#32404d';x.lineWidth=3;x.strokeRect(6,6,W-12,H-12);x.fillStyle='#f3c36a';x.font='700 38px Arial';x.fillText(d.title,55,62);x.fillStyle='#7f91a2';x.font='18px Arial';x.fillText('DEMO DATA • MICHAEL DIGITAL TWIN OFFICE',55,96);let gap=18,left=55,top=125,cw=(W-110-gap*3)/4,ch=140;d.kpis.forEach(([v,l],i)=>{let px=left+i*(cw+gap);x.fillStyle='#161e26';x.fillRect(px,top,cw,ch);x.strokeStyle='#33414d';x.strokeRect(px,top,cw,ch);x.fillStyle='#95a2ad';x.font='18px Arial';x.fillText(l,px+20,top+38);x.fillStyle='#f5c56d';x.font='700 42px Arial';x.fillText(v,px+20,top+94)});let gx=55,gy=305,gw=W*.58,gh=360;x.fillStyle='#111820';x.fillRect(gx,gy,gw,gh);x.strokeStyle='#2d3944';x.strokeRect(gx,gy,gw,gh);x.fillStyle='#dce5ec';x.font='700 24px Arial';x.fillText('進度 S-Curve',gx+28,gy+42);let px=gx+45,py=gy+70,pw=gw-80,ph=gh-110;x.strokeStyle='#33404a';x.beginPath();x.moveTo(px,py);x.lineTo(px,py+ph);x.lineTo(px+pw,py+ph);x.stroke();const plot=(a,col)=>{x.strokeStyle=col;x.lineWidth=6;x.beginPath();a.forEach((v,i)=>{let xx=px+i*pw/(a.length-1),yy=py+ph-v/100*ph;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke()};plot(d.plan,'#6ea8ff');plot(d.actual,'#f4c46b');let rx=W*.67,ry=305,rw=W*.285,rh=360;x.fillStyle='#111820';x.fillRect(rx,ry,rw,rh);x.strokeStyle='#2d3944';x.strokeRect(rx,ry,rw,rh);x.fillStyle='#dce5ec';x.font='700 23px Arial';x.fillText('工作面完成率',rx+24,ry+42);d.bars.forEach(([n,v],i)=>{let yy=ry+95+i*62;x.fillStyle='#9ba7b2';x.font='18px Arial';x.fillText(n,rx+24,yy);x.fillStyle='#29323a';x.fillRect(rx+115,yy-16,rw-180,16);let gg=x.createLinearGradient(rx+115,0,rx+rw-65,0);gg.addColorStop(0,'#6ea8ff');gg.addColorStop(1,'#f4c46b');x.fillStyle=gg;x.fillRect(rx+115,yy-16,(rw-180)*v/100,16);x.fillStyle='#dce5ec';x.fillText(v+'%',rx+rw-55,yy)});const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t}
