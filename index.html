const views={overview:{p:[9.3,5.6,12.4],t:[0,1.65,-.8]},about:{p:[4.2,3.0,6.1],t:[0.15,1.62,.72]},career:{p:[-2.4,3.0,3.0],t:[-4.0,2.65,-3.95]},projects:{p:[2.6,3.3,3.0],t:[.35,2.8,-4.05]},gallery:{p:[3.7,3.0,4.2],t:[6.05,2.55,.2]},ai:{p:[5.9,2.3,5.7],t:[4.45,1.1,2.65]},education:{p:[-2.1,2.2,1.2],t:[-4.45,1.0,-3.1]}};
function focus(k,open=true){const v=views[k]||views.overview;gsap.killTweensOf(camera.position);gsap.to(camera.position,{duration:1.05,x:v.p[0],y:v.p[1],z:v.p[2],ease:'power2.inOut'});gsap.to(look,{duration:1.05,x:v.t[0],y:v.t[1],z:v.t[2],ease:'power2.inOut'});document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===k));if(open&&DATA[k])show(k)}
function show(k){const d=DATA[k];if(!d)return;document.getElementById('kicker').textContent=d.k;document.getElementById('title').textContent=d.t;document.getElementById('body').textContent=d.b;document.getElementById('grid').innerHTML=d.c.map(v=>`<div class="card"><b>${v[0]}</b><small>${v[1]}</small></div>`).join('');document.getElementById('panel').classList.add('open')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>focus(b.dataset.v,b.dataset.v!=='overview'));document.getElementById('close').onclick=()=>document.getElementById('panel').classList.remove('open');
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY});addEventListener('pointerup',e=>{if(!dragging)return;const moved=Math.hypot(e.clientX-px,e.clientY-py);dragging=false;if(moved<7){mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(scene.children,true).find(h=>interactive.includes(h.object.name));if(hit)focus(hit.object.name)}});addEventListener('pointermove',e=>{if(!dragging)return;yaw+=(e.clientX-px)*.0028;pitch=Math.max(-.18,Math.min(.18,pitch+(e.clientY-py)*.0022));px=e.clientX;py=e.clientY});
let night=false;document.getElementById('theme').onclick=()=>{night=!night;document.getElementById('theme').textContent=night?'☀ 日間':'☾ 夜間';gsap.to(hemi,{intensity:night?.38:1.3,duration:.6});gsap.to(sun,{intensity:night?.38:3.2,duration:.6});gsap.to(warm,{intensity:night?28:18,duration:.6});gsap.to(warm2,{intensity:night?18:11,duration:.6});renderer.toneMappingExposure=night?.73:1.03;scene.background.set(night?'#16181b':'#bfb6aa');scene.fog.color.copy(scene.background)};
function animate(){requestAnimationFrame(animate);const t=look.clone();if(dragging||Math.abs(yaw)+Math.abs(pitch)>.001){t.x+=Math.sin(yaw)*2.4;t.y+=pitch*2.0;t.z+=Math.cos(yaw)*.35}camera.lookAt(t);orb.rotation.y+=.004;renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<760?1.25:1.6))});
</script>
