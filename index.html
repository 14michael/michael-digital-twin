<!doctype html>

<head>

<meta name="theme-color" content="#141414" />
<title>Michael Huang | 3D Executive Studio</title>
<style>
:root{--ink:#f6f2ea;--muted:#b7b0a5;--accent:#e69a4c;--panel:rgba(17,18,20,.84);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515;color:var(--ink);font-family:"Microsoft JhengHei",Inter,system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}
.brand{position:fixed;z-index:20;left:18px;top:18px;padding:13px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px)}.brand b{display:block;font-size:18px;letter-spacing:.06em}.brand span{display:block;margin-top:4px;color:var(--muted);font-size:11px}
.theme{position:fixed;z-index:20;right:18px;top:18px;border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:999px;padding:10px 13px;cursor:pointer}
.stats{position:fixed;z-index:20;right:18px;top:70px;padding:9px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font:10px/1.6 ui-monospace,monospace;color:#75e0b0}
.hint{position:fixed;z-index:20;left:50%;top:110px;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:rgba(20,20,20,.68);border:1px solid var(--line);font-size:11px;white-space:nowrap}
.nav{position:fixed;z-index:25;left:18px;right:18px;bottom:18px;display:flex;gap:7px;flex-wrap:wrap}.nav button{border:1px solid var(--line);background:rgba(24,24,25,.88);color:#fff;border-radius:999px;padding:10px 13px;cursor:pointer}.nav button.active{background:var(--accent);color:#18120c;border-color:transparent}
.drawer{position:fixed;z-index:40;right:0;top:0;width:min(450px,94vw);height:100%;padding:82px 24px 30px;background:rgba(13,15,18,.96);border-left:1px solid var(--line);transform:translateX(104%);transition:.34s cubic-bezier(.2,.75,.2,1);overflow:auto}.drawer.open{transform:none}.drawer .close{position:absolute;right:17px;top:17px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#ffffff0b;color:#fff;font-size:23px;cursor:pointer}.kicker{color:#efad63;font-size:11px;font-weight:800;letter-spacing:.14em}.drawer h2{margin:8px 0 10px;color:#f0bc78}.drawer p{font-size:14px;line-height:1.75;color:#c7c0b6}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.card{padding:12px;border-radius:12px;border:1px solid var(--line);background:#ffffff07}.card b{display:block;color:#f0bc78}.card small{display:block;color:#9f998f;margin-top:4px;line-height:1.45}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:7px 9px;border-radius:999px;background:#efad6314;border:1px solid #efad6340;color:#f1c58e;font-size:11px}
@media(max-width:720px){.brand b{font-size:14px}.brand span,.stats{display:none}.hint{top:auto;bottom:76px;max-width:86vw;overflow:hidden;text-overflow:ellipsis}.nav{overflow-x:auto;flex-wrap:nowrap;left:10px;right:10px}.nav button{white-space:nowrap;padding:9px 11px}.drawer{width:100vw}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"}}</script>

</head>
<body>
<div class="brand"><b>MICHAEL HUANG · 3D EXECUTIVE STUDIO</b><span>工程管理 × 採購發包 × 成本控制 × AI 數位轉型</span></div>

<aside class="drawer" id="drawer"><button class="close" id="close">×</button><div class="kicker" id="kicker"></div><h2 id="title"></h2><p id="body"></p><div class="cards" id="cards"></div><div class="badge">履歷來源：使用者上傳 15 頁履歷</div></aside>
<script type="module">
import * as THREE from 'three';
const gsap=window.gsap;
const CONTENT={
  desk:{k:'EXECUTIVE PROFILE',t:'黃連燈 Michael Huang',b:'25 年以上工作經歷，歷經工程官、現場工程師、工程組長、工地主任、採購經理、採發部經理與業務處經理兼部門主管。核心定位是把施工經驗帶進採購、成本、合約與制度治理。',c:[['25+ 年','完整工程與管理歷練'],['20+ 年','營造採購與工程管理'],['12+ 年','第一線施工管理'],['AI','流程、知識與決策輔助']]},
  career:{k:'CAREER JOURNEY',t:'從施工現場到工程治理',b:'職涯從軍中工程管理與施工現場開始，逐步進入工地主任、採發主管、採購經理與公司部門管理；2026 年後聚焦顧問、作者、講師與 AI 工程管理。',c:[['1985–2000','工程官／施工管理'],['2001–2008','理成營造｜工程師→工地主任'],['2008–2016','理成營造｜採發部經理'],['2018–2026','安倉營造｜業務處經理']]},

  knowledge:{k:'EDUCATION & CREDENTIALS',t:'學歷、證照與專業訓練',b:'國立台北科技大學技術及職業教育研究所碩士；國防大學中正理工學院土木工程科。具工地主任、公共工程品質管理、機電品管及安衛相關資格。',c:[['北科大','技職教育研究所碩士'],['中正理工','土木工程科'],['工地主任','內政部國土管理署'],['品管／安衛','公共工程與職安資格']]}
};
const scene=new THREE.Scene();scene.background=new THREE.Color('#d9d1c6');scene.fog=new THREE.Fog('#d9d1c6',17,33);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,80);camera.position.set(7.8,5.1,9.8);let target=new THREE.Vector3(0,1.2,0);camera.lookAt(target);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff3df,0x665c56,1.55));const sun=new THREE.DirectionalLight(0xffe8c8,2.0);sun.position.set(4,9,6);scene.add(sun);
const mats={floor:new THREE.MeshStandardMaterial({color:'#c89c62',roughness:.72}),wall:new THREE.MeshStandardMaterial({color:'#efe8de',roughness:.92}),accent:new THREE.MeshStandardMaterial({color:'#9b4f36',roughness:.86}),wood:new THREE.MeshStandardMaterial({color:'#c78b4f',roughness:.64}),dark:new THREE.MeshStandardMaterial({color:'#242326',roughness:.72}),red:new THREE.MeshStandardMaterial({color:'#8c2d23',roughness:.68}),cream:new THREE.MeshStandardMaterial({color:'#e7dcc8',roughness:.9}),black:new THREE.MeshStandardMaterial({color:'#0e1115',roughness:.52}),green:new THREE.MeshStandardMaterial({color:'#457e55',roughness:.8}),gold:new THREE.MeshStandardMaterial({color:'#c18b38',roughness:.46,metalness:.32}),screen:new THREE.MeshBasicMaterial({color:'#15203a'}),white:new THREE.MeshStandardMaterial({color:'#f0ede7',roughness:.75})};
function box(size,pos,mat,name=''){const m=new THREE.Mesh(new THREE.BoxGeometry(...size),mat);m.position.set(...pos);m.name=name;scene.add(m);return m}
function cyl(r,h,pos,mat,name=''){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),mat);m.position.set(...pos);m.name=name;scene.add(m);return m}
function roundedRug(){const s=new THREE.Shape();const w=5.4,h=3.4,r=.6;s.moveTo(-w/2+r,-h/2);s.lineTo(w/2-r,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);s.lineTo(w/2,h/2-r);s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);s.lineTo(-w/2+r,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);s.lineTo(-w/2,-h/2+r);s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);const g=new THREE.ShapeGeometry(s);const m=new THREE.Mesh(g,mats.cream);m.rotation.x=-Math.PI/2;m.position.set(.2,.015,.9);scene.add(m)}
box([12,.16,8],[0,-.08,0],mats.floor);box([12,5,.16],[0,2.45,-3.9],mats.accent);box([.16,5,8],[-5.92,2.45,0],mats.wall);box([.16,5,8],[5.92,2.45,0],mats.wall);box([12,.14,.26],[0,4.96,-3.78],mats.wall);roundedRug();
box([3.55,2.65,.11],[-3.75,2.45,-3.72],mats.white,'VIS_Career');box([6.6,2.55,.14],[1.65,2.5,-3.7],mats.black,'VIS_Projects');
box([4.65,.22,1.65],[.3,1.02,.72],mats.wood,'VIS_Desk');for(const x of [-1.65,2.25])for(const z of [.15,1.3])box([.22,1.0,.22],[x,.5,z],mats.wood);
box([1.25,.25,1.15],[.3,.65,2.35],mats.red);box([1.35,1.35,.26],[.3,1.48,2.82],mats.red);cyl(.08,.65,[.3,.36,2.35],mats.dark);cyl(.58,.08,[.3,.08,2.35],mats.dark);
box([1.95,1.18,.12],[.05,1.73,.36],mats.black,'VIS_Profile');box([1.72,.92,.03],[.05,1.73,.28],mats.screen);box([.18,.52,.15],[.05,1.18,.42],mats.dark);box([.72,.08,.38],[.05,.94,.45],mats.dark);
box([.82,.05,.34],[-.75,1.17,.85],mats.white);box([.42,.08,.65],[-.95,1.2,.35],mats.white);cyl(.18,.32,[1.28,1.24,.36],mats.white);cyl(.14,.26,[1.72,1.19,.42],mats.gold);box([.62,.8,.08],[1.65,1.55,.2],mats.black,'VIS_AI');
cyl(.18,.1,[2.0,1.21,.9],mats.gold);box([.08,.8,.08],[2.0,1.62,.9],mats.gold);const shade=new THREE.Mesh(new THREE.ConeGeometry(.33,.38,32),mats.gold);shade.position.set(1.78,1.98,.9);shade.rotation.z=-.65;scene.add(shade);
cyl(.38,.55,[4.65,.3,-2.4],mats.white);for(let i=0;i<10;i++){const leaf=new THREE.Mesh(new THREE.SphereGeometry(.34,12,8),mats.green);leaf.scale.set(1.8,.35,.8);leaf.rotation.z=(i%5)*.55;leaf.position.set(4.65+Math.cos(i)*.45,1.0+(i%3)*.28,-2.4+Math.sin(i)*.35);scene.add(leaf)}
for(let r=0;r<3;r++)for(let c=0;c<4;c++){let x=3.45+c*.62,y=3.35-r*.78;box([.52,.38,.07],[x,y,-3.58],mats.white,'VIS_Gallery');box([.43,.29,.02],[x,y,-3.52],(r+c)%2?mats.screen:mats.cream)}
box([2.5,.18,.55],[4.35,.45,-1.8],mats.wood);for(const x of [3.35,4.35,5.35])box([.14,.8,.5],[x,.1,-1.8],mats.wood);for(let i=0;i<8;i++)box([.16,.34,.35],[3.35+(i%5)*.4,.72,-1.76],i%2?mats.white:mats.gold,'VIS_Knowledge');
function textureBoard(kind){const c=document.createElement('canvas');c.width=1280;c.height=720;const x=c.getContext('2d');x.fillStyle=kind==='career'?'#efe7d8':'#111820';x.fillRect(0,0,c.width,c.height);x.strokeStyle=kind==='career'?'#b99d72':'#355064';x.lineWidth=5;x.strokeRect(8,8,c.width-16,c.height-16);if(kind==='career'){x.fillStyle='#25344a';x.font='700 46px Arial';x.fillText('MY CAREER JOURNEY',70,80);x.strokeStyle='#c69855';x.lineWidth=5;x.beginPath();x.moveTo(170,150);x.lineTo(170,620);x.stroke();const rows=[['1985–2000','工程官／施工管理'],['2001–2008','工程師→工程組長→工地主任'],['2008–2016','採發部經理兼部門主管'],['2016–2017','欣巴巴｜採購經理'],['2018–2026','安倉營造｜業務處經理']];rows.forEach((r,i)=>{let y=175+i*100;x.fillStyle='#c69855';x.beginPath();x.arc(170,y,10,0,Math.PI*2);x.fill();x.fillStyle='#263340';x.font='700 26px Arial';x.fillText(r[0],215,y-8);x.font='22px Arial';x.fillText(r[1],215,y+28)});x.fillStyle='#56606a';x.font='18px Arial';x.fillText('FROM CONSTRUCTION SITE TO EXECUTIVE GOVERNANCE',70,675)}else{x.fillStyle='#f0b85c';x.font='700 42px Arial';x.fillText('PROJECTS · AI · PORTFOLIO',60,68);x.fillStyle='#7f91a2';x.font='20px Arial';x.fillText('Engineering practice × digital transformation',60,100);const cols=[['PROJECTS','台北藝術中心\n東吳大學\n華航園區'],['AI SYSTEMS','AI Agent\nKMS\nPM Dashboard'],['METHODS','採購發包\n成本控管\n工程治理']];cols.forEach((it,i)=>{let px=60+i*390;x.fillStyle='#18232d';x.fillRect(px,145,340,380);x.strokeStyle='#314659';x.strokeRect(px,145,340,380);x.fillStyle='#f0b85c';x.font='700 28px Arial';x.fillText(it[0],px+24,190);x.fillStyle='#d7e0e8';x.font='24px Arial';it[1].split('\n').forEach((t,j)=>x.fillText('• '+t,px+24,250+j*62))});x.fillStyle='#748696';x.font='18px Arial';x.fillText('Click the wall to explore detailed resume content',60,650)}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const careerPlane=new THREE.Mesh(new THREE.PlaneGeometry(3.3,2.45),new THREE.MeshBasicMaterial({map:textureBoard('career'),toneMapped:false}));careerPlane.position.set(-3.75,2.45,-3.64);scene.add(careerPlane);
const projectPlane=new THREE.Mesh(new THREE.PlaneGeometry(6.3,2.3),new THREE.MeshBasicMaterial({map:textureBoard('projects'),toneMapped:false}));projectPlane.position.set(1.65,2.5,-3.61);scene.add(projectPlane);
const hits=[],ray=new THREE.Raycaster(),ptr=new THREE.Vector2();function hb(view,size,pos){const m=new THREE.Mesh(new THREE.BoxGeometry(...size),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));m.userData.view=view;m.position.set(...pos);scene.add(m);hits.push(m)}
hb('desk',[4.8,2.2,2.2],[.3,1.3,.7]);hb('career',[3.7,2.9,.5],[-3.75,2.45,-3.55]);hb('projects',[6.8,2.8,.5],[1.65,2.5,-3.5]);hb('gallery',[2.8,2.8,.6],[4.2,2.4,-3.5]);hb('ai',[1.1,1.3,1.0],[1.65,1.6,.3]);hb('knowledge',[2.7,1.6,1.2],[4.35,.75,-1.8]);
const V={overview:[[7.8,5.1,9.8],[0,1.25,-.6]],desk:[[3.0,2.6,4.3],[.25,1.45,.65]],career:[[-1.6,2.9,1.6],[-3.75,2.45,-3.6]],projects:[[2.4,3.0,1.8],[1.65,2.5,-3.6]],gallery:[[5.8,2.6,.5],[4.15,2.35,-3.55]],ai:[[3.2,2.0,2.4],[1.65,1.55,.3]],knowledge:[[5.8,1.8,.1],[4.35,.75,-1.8]]};
let state='overview',busy=false,yaw=.58,pitch=.42,radius=12.2,last=null,drag=false,down=null;
function show(view){const d=CONTENT[view]||CONTENT.desk;document.getElementById('kicker').textContent=d.k;document.getElementById('title').textContent=d.t;document.getElementById('body').textContent=d.b;document.getElementById('cards').innerHTML=d.c.map(([a,b])=>`<div class="card"><b>${a}</b><small>${b}</small></div>`).join('');document.getElementById('drawer').classList.add('open')}
function hide(){document.getElementById('drawer').classList.remove('open')}document.getElementById('close').onclick=hide;
function go(v){if(busy||!V[v])return;busy=true;hide();const [p,t]=V[v];gsap.killTweensOf(camera.position);gsap.killTweensOf(target);gsap.timeline({onUpdate:()=>camera.lookAt(target),onComplete:()=>{state=v;busy=false;document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v));if(v!=='overview')show(v)}}).to(camera.position,{x:p[0],y:p[1],z:p[2],duration:1.15,ease:'power2.inOut'},0).to(target,{x:t[0],y:t[1],z:t[2],duration:1.15,ease:'power2.inOut'},0)}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
function orbit(){if(state!=='overview')return;const cp=Math.cos(pitch);camera.position.set(target.x+radius*cp*Math.sin(yaw),target.y+radius*Math.sin(pitch),target.z+radius*cp*Math.cos(yaw));camera.lookAt(target)}
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};last={x:e.clientX,y:e.clientY};drag=true;renderer.domElement.setPointerCapture?.(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag||state!=='overview')return;const dx=e.clientX-last.x,dy=e.clientY-last.y;last={x:e.clientX,y:e.clientY};yaw-=dx*.0045;pitch=THREE.MathUtils.clamp(pitch-dy*.0038,.22,.82);orbit()});
renderer.domElement.addEventListener('pointerup',e=>{const dist=down?Math.hypot(e.clientX-down.x,e.clientY-down.y):99;drag=false;if(dist<8){const r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));ray.setFromCamera(ptr,camera);const a=ray.intersectObjects(hits,false);if(a[0])go(a[0].object.userData.view)}});
renderer.domElement.addEventListener('wheel',e=>{if(state!=='overview')return;e.preventDefault();radius=THREE.MathUtils.clamp(radius+e.deltaY*.008,8,15);orbit()},{passive:false});
let night=false;document.getElementById('theme').onclick=()=>{night=!night;const c=new THREE.Color(night?'#15181d':'#d9d1c6');gsap.to(scene.background,{r:c.r,g:c.g,b:c.b,duration:.6});gsap.to(sun,{intensity:night?.55:2,duration:.6});document.getElementById('theme').textContent=night?'☀ 日間':'☾ 夜間'};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<800?1.25:1.5))});
let frames=0,lastT=performance.now();function loop(t){requestAnimationFrame(loop);renderer.render(scene,camera);frames++;if(t-lastT>600){const fps=Math.round(frames*1000/(t-lastT)),i=renderer.info.render;document.getElementById('stats').innerHTML=`FPS ${fps}<br>CALLS ${i.calls}<br>TRIS ${i.triangles}<br>DPR ${renderer.getPixelRatio().toFixed(1)}`;frames=0;lastT=t}}requestAnimationFrame(loop);
</script>
