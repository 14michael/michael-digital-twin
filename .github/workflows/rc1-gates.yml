name: RC1 Gates

on:
  push:
    branches: [rc1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-contract:
    name: Static contract and syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax checks
        run: |
          node --check src/real-assets.js
          node --check src/spatial-studio.js
          node --check tests/acceptance/rc1-static-contract.mjs

      - name: RC1 static acceptance contract
        run: node tests/acceptance/rc1-static-contract.mjs

      - name: Record current RC1 commit
        if: always()
        run: |
          echo "RC1_SHA=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Static verification date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_STEP_SUMMARY"
          echo "RC-05 intentionally remains blocking while core runtime assets use remote URLs." >> "$GITHUB_STEP_SUMMARY"
