function setupSignature(){let cv=$('sigCanvas'),cx=cv.getContext('2d');cx.fillStyle='#f8f4ea';cx.fillRect(0,0,cv.width,cv.height);cx.strokeStyle='#21201e';cx.lineWidth=4;cx.lineCap='round';let drawing=false;function pos(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);let p=pos(e);cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x+.1,p.y+.1);cx.stroke()};cv.onpointermove=e=>{if(!drawing)return;let p=pos(e);cx.lineTo(p.x,p.y);cx.stroke()};cv.onpointerup=()=>{drawing=false;currentSignature=cv.toDataURL('image/png')};$('clearSignature').onclick=()=>{cx.fillStyle='#f8f4ea';cx.fillRect(0,0,cv.width,cv.height);currentSignature=''}}
async function encodeFile(file,kind){if(!file)return null;if(file.size>2*1024*1024)throw new Error(`附件 ${file.name} 超過 2 MB`);if(kind==='image'){if(!file.type.startsWith('image/'))throw new Error('請選擇圖片檔');return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let ratio=Math.min(1,1200/Math.max(im.naturalWidth,im.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(im.naturalHeight*ratio));let ctx=canvas.getContext('2d');ctx.drawImage(im,0,0,canvas.width,canvas.height);resolve({name:file.name,mime:'image/jpeg',data:canvas.toDataURL('image/jpeg',.77)})};im.onerror=()=>reject(new Error('照片無法解碼'));im.src=String(reader.result)};reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file)})}return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve({name:file.name,mime:file.type||'application/octet-stream',data:reader.result});reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file)})}

async function importBackup(file){if(!file)return;try{let payload=JSON.parse(await file.text());if(payload.format!=='renovation-suite'||payload.version!==1||!Array.isArray(payload.records))throw new Error('備份版本或格式不符');if(payload.records.length>20000)throw new Error('資料筆數超出安全上限');let ids=new Set();for(let r of payload.records){if(!r||typeof r.id!=='string'||!byId[r.feature]||typeof r.values!=='object'||!r.values||typeof r.project!=='string'||ids.has(r.id))throw new Error('備份內容結構或重複 ID 異常');ids.add(r.id)}if(!confirm(`備份有 ${payload.records.length} 筆，匯入將覆蓋本機現有全部紀錄。確定嗎？`))return;await new Promise((resolve,reject)=>{let tx=db.transaction(STORE,'readwrite'),store=tx.objectStore(STORE);store.clear();for(let r of payload.records)store.put(r);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});let verify=await getAll();if(verify.length!==payload.records.length)throw new Error('匯入後筆數驗證失敗');await refresh();notify('備份匯入成功並驗證：'+verify.length+' 筆')}catch(e){notify('匯入失敗：'+e.message)}}
function subset(id,projectName){return records.filter(x=>x.feature===id&&(!projectName||x.project===projectName))}
function metric(label,value){return `<div class="metric"><b>${safe(value)}</b><span>${safe(label)}</span></div>`}
function canvasRoom(rec){let v=rec?.values||{},w=Math.min(450,Math.max(130,Number(v.width||4)*35)),l=Math.min(300,Math.max(100,Number(v.length||5)*25)),h=Math.min(175,Math.max(70,Number(v.height||3)*50)),col=/^#[0-9a-f]{6}$/i.test(v.wall||'')?v.wall:'#bdb09b',ox=230,oy=235,p0=[ox,oy],p1=[ox+w,oy-40],p2=[ox+w-l*.75,oy-40-l*.40],p3=[ox-l*.75,oy-l*.40];let pts=a=>a.map(q=>q.map(Math.round).join(',')).join(' ');return `<svg class="svgroom" viewBox="-55 -20 720 340" role="img" aria-label="簡化 3D 空間量體圖"><polygon points="${pts([p0,p1,p2,p3])}" fill="#a88a62" stroke="#e5d4b8" stroke-width="2"/><polygon points="${pts([[...p3],[...p2],[p2[0],p2[1]-h],[p3[0],p3[1]-h]])}" fill="${col}" stroke="#e5d4b8" stroke-width="2"/><polygon points="${pts([[...p2],[...p1],[p1[0],p1[1]-h],[p2[0],p2[1]-h]])}" fill="#85847c" stroke="#e5d4b8" stroke-width="2"/><path d="M${p3[0]} ${p3[1]-h}L${p3[0]} ${p3[1]}" stroke="#fff4" stroke-dasharray="5,5"/><text x="205" y="320" fill="#e2c494" font-size="17">長 ${safe(v.length||0)}m × 寬 ${safe(v.width||0)}m × 高 ${safe(v.height||0)}m</text></svg>`}
function renderExtras(){if(!current)return;let projectFilter=$('field_project')?.value?.trim()||'',html='';const c=key=>subset(key,projectFilter);switch(current){
case'B01':{let arr=c('B01');let total=arr.reduce((s,r)=>s+Number(r.values.qty||0)*Number(r.values.price||0),0);let price=Number($('field_price').value||0),qty=Number($('field_qty').value||0),tax=Number($('field_tax').value||5);html=`<div class="extra"><h3>即時計算及專案估價彙總</h3><div class="metricgrid">${metric('目前輸入未稅金額',fmt(qty*price)+' 元')}${metric('目前輸入含稅金額',fmt(qty*price*(1+tax/100))+' 元')}${metric('已儲存明細未稅合計',fmt(total)+' 元')}</div><p class="viewerhint">計算：數量 × 單價；含稅＝未稅 ×（1＋稅率÷100）。彙總範圍：${safe(projectFilter||'全部專案')}。</p></div>`;break}
case'Q02':{let sum=c('Q02').reduce((a,r)=>a+(r.values.change==='減項'?-1:1)*Number(r.values.qty||0)*Number(r.values.unitPrice||0),0);html=`<div class="extra"><h3>追加減淨額</h3><div class="metricgrid">${metric('專案淨追加／減項',fmt(sum)+' 元')}</div><p>計算＝追加數量×單價－減項數量×單價；本數值包含未核准異動，正式價金須另行核對。</p></div>`;break}
case'Q03':case'Q04':case'H02':{let arr=c(current);let total=arr.reduce((s,r)=>s+Number(r.values.qty??r.values.hours??0)*Number(r.values.price??r.values.rate??0),0);html=`<div class="extra"><h3>金額試算</h3><div class="metricgrid">${metric('紀錄合計',fmt(total)+' 元')}</div></div>`;break}
case'H04':{let rows=c('H04'),total=rows.reduce((s,r)=>s+(r.values.direction==='收入'?1:-1)*Number(r.values.amount||0),0);html=`<div class="extra"><h3>零用金帳面結餘</h3><div class="metricgrid">${metric('收入減支出',fmt(total)+' 元')}${metric('收支筆數',rows.length+' 筆')}</div><p>屬本機帳面計算，尚未對帳與審核。</p></div>`;break}
case'C01':case'H03':{let arr=c(current).slice(0,30).filter(r=>r.values.start&&r.values.end),dates=arr.flatMap(r=>[Date.parse(r.values.start),Date.parse(r.values.end)]).filter(Number.isFinite);if(dates.length){let start=Math.min(...dates),end=Math.max(...dates)+86400000,range=Math.max(86400000,end-start);html=`<div class="extra"><h3>工期甘特檢視</h3><div class="gantt">${arr.map(r=>{let a=Math.max(0,(Date.parse(r.values.start)-start)/range*100),b=Math.max(1,(Date.parse(r.values.end)+86400000-Date.parse(r.values.start))/range*100);return `<div class="ganttrow"><span>${safe(r.values.work)}</span><div class="track"><span style="margin-left:${a.toFixed(2)}%;width:${b.toFixed(2)}%" title="${safe(r.values.start)} 至 ${safe(r.values.end)}"></span></div></div>`}).join('')}</div><p class="viewerhint">橫軸按目前紀錄的最早至最晚日期同比例繪製。</p></div>`}break}
case'D02':html=`<div class="extra"><h3>簡易室內量體預覽</h3>${canvasRoom({values:{length:$('field_length').value||5,width:$('field_width').value||4,height:$('field_height').value||3,wall:$('field_wall').value}})}<p>本圖依輸入尺寸計算的幾何示意，非完整 3D 建模、BIM 或照片級 AI 渲染。</p></div>`;break;
case'D06':case'R05':{let keys=current==='D06'?['B05','D05']:['B05','D05','C01'];let data=keys.flatMap(k=>c(k).map(r=>({...r,featureTitle:byId[r.feature].title})));html=`<div class="extra"><h3>${current==='D06'?'依專案來源彙整材質表':'設備與工期關聯紀錄'}</h3>${data.length?`<div style="overflow-x:auto"><table style="width:100%;font-size:13px;border-collapse:collapse"><thead><tr><th>來源</th><th>項目</th><th>規格／日期</th><th>數量</th></tr></thead><tbody>${data.map(r=>`<tr><td>${safe(r.featureTitle)}</td><td>${safe(r.values.name||r.values.work)}</td><td>${safe(r.values.material||r.values.spec||r.values.start||'')}</td><td>${safe(r.values.qty||'')}</td></tr>`).join('')}</tbody></table></div>`:'<p>尚無關聯設備／排程紀錄，請先新增相關功能資料。</p>'}<button class="outline" type="button" id="exportDerived">匯出關聯資料 CSV</button><p class="viewerhint">僅彙整實際已保存紀錄，不會自動產生不存在的材質規格。</p></div>`;break}
case'B03':{let p=c('B03').find(r=>r.files?.pano?.data);if(p){html=`<div class="extra"><h3>已保存環景圖片互動檢視</h3><div id="panoViewer" class="viewer"><img id="panoImg" alt="環景圖片" src="${p.files.pano.data}"></div><p class="viewerhint">手指左右拖曳調整觀看位置。僅為已上傳全景影像檢視，不是自動生成的 3D 房間。</p></div>`}break}
case'F02':{let s=c('F02').find(r=>r.files?.signature);if(s)html=`<div class="extra"><h3>最近一筆手寫簽名</h3><img class="previewimg" style="max-height:180px" src="${s.files.signature}" alt="儲存的簽名圖像"><p>簽名人：${safe(s.values.signer)}</p></div>`;break}
case'C05':{let arr=c('C05');html=`<div class="extra"><h3>工地地址及地圖</h3>${arr.map(r=>{let v=r.values,url=v.latitude&&v.longitude?`https://www.google.com/maps?q=${encodeURIComponent(v.latitude+','+v.longitude)}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.address||'')}`;return `<p>${safe(v.address||'')}</p><a href="${safe(url)}" target="_blank" rel="noopener noreferrer">在 Google 地圖開啟此位置</a>`}).join('<hr>')||'<p>請先保存工地地址，才會顯示地圖連結。</p>'}</div>`;break}
case'R01':{let linked=records.filter(r=>r.project===projectFilter&&r.feature!=='R01');html=`<div class="extra"><h3>專案履歷關聯</h3><div class="metricgrid">${metric('目前專案關聯紀錄',linked.length+' 筆')}${metric('相關功能種類',new Set(linked.map(r=>r.feature)).size+' 類')}</div><p>請在上方填入同一專案名稱，可檢視各模組紀錄的關聯統計。</p></div>`;break}
} $('workspaceExtras').innerHTML=html;if(['D06','R05'].includes(current)&&$('exportDerived'))$('exportDerived').onclick=()=>{let keys=current==='D06'?['B05','D05']:['B05','D05','C01'];let rows=[['來源功能','專案','項目','規格','單位','數量','開始日','完成日']];for(let k of keys)for(let r of c(k))rows.push([byId[k].title,r.project,r.values.name||r.values.work,r.values.material||r.values.spec||'',r.values.unit||'',r.values.qty||'',r.values.start||'',r.values.end||'']);saveDownload(current+'-derived.csv','\ufeff'+rows.map(x=>x.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8')};if(current==='B03'&&$('panoImg')){let view=$('panoViewer'),img=$('panoImg'),offset=0,x0=null;const paint=()=>{let left=Math.min(0,Math.max(view.clientWidth-img.clientWidth,offset));offset=left;img.style.left=left+'px'};img.onload=()=>{img.style.height=view.clientHeight+'px';img.style.width='auto';paint()};view.onpointerdown=e=>{x0=e.clientX;view.setPointerCapture(e.pointerId)};view.onpointermove=e=>{if(x0===null)return;offset+=e.clientX-x0;x0=e.clientX;paint()};view.onpointerup=()=>x0=null}}
function bind(){document.addEventListener('click',async e=>{let target=e.target.closest('[data-go],[data-edit],[data-del],[data-print]');if(!target)return;if(target.dataset.go){openFeature(target.dataset.go);return}if(target.dataset.edit){editRecord(target.dataset.edit);return}if(target.dataset.print){printOne(target.dataset.print);return}if(target.dataset.del){if(!confirm('確定刪除此筆紀錄？此動作無法復原。'))return;try{await dbreq('delete',target.dataset.del);await refresh();notify('已刪除')}catch(err){error('刪除失敗：'+err.message)}}});$('backHome').onclick=showHome;$('filterInput').oninput=renderList;$('clearBtn').onclick=clearForm;$('exportFeature').onclick=exportCsv;$('backupBtn').onclick=backup;$('importBtn').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{await importBackup(e.target.files[0]);e.target.value=''};document.addEventListener('input',e=>{if(!current)return;if(['field_qty','field_price','field_tax','field_project','field_length','field_width','field_height','field_wall'].includes(e.target?.id))renderExtras()})}

window.__renovation={modules,specs,byId,getAll:async()=>dbReady?getAll():[],get ready(){return dbReady}};start();
