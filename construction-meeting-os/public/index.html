<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Construction Meeting OS</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#20242a}header{background:#172b3a;color:white;padding:20px}main{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 10px #0001}.draft{border-left:5px solid #999;margin:10px 0;padding:10px;background:#fafafa}button{padding:8px 14px}small{color:#667}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><header><h2>Construction Meeting OS V1.0</h2><div id="meeting"></div></header><main><div class="grid"><section class="card"><h3>Evidence｜逐字稿</h3><div id="evidence"></div></section><section class="card"><h3>AI Draft｜待人工覆核</h3><div id="drafts"></div></section></div><section class="card"><h3>Official Events｜HUMAN VERIFIED</h3><div id="events"></div></section></main><script>
async function load(){let d=await fetch('/api/v1/demo').then(r=>r.json());meeting.textContent=d.meeting.title+'｜'+d.meeting.date; evidence.innerHTML=d.segments.map(s=>'<p><b>'+s.speaker+'</b> <small>'+s.id+'</small><br>'+s.text+'</p>').join('');drafts.innerHTML=d.drafts.map(x=>'<div class="draft"><b>'+x.event_type+' / '+x.domain+'</b><p>'+x.subject+'</p><small>Evidence: '+x.evidence[0].segment_id+'｜AI Draft，不是正式紀錄</small><br><button onclick="verify(\''+x.id+'\')">人工確認</button></div>').join('');events.innerHTML=d.events.length?d.events.map(x=>'<p>✅ '+x.event_type+'｜'+x.subject+'｜'+x.verified_by+'</p>').join(''):'尚無正式事件';}
async function verify(id){await fetch('/api/v1/draft-events/'+id+'/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({reviewer:'Michael'})});load()}load();</script></html>
